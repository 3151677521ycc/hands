name: dylogin
on:
  workflow_dispatch:
    inputs:
      pat:
        description: pat
        required: true
      nowait:
        description: nowait
        required: false
        default: "0"
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: run
        env:
          GHPAT: ${{ inputs.pat }}
          NOWAIT: ${{ inputs.nowait }}
        run: |
          python3 -m pip install --quiet playwright
          python3 -m playwright install chromium
          python3 dy.py
