name: dylogin
on:
  workflow_dispatch:
    inputs:
      pat:
        description: pat
        required: true
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: run
        env:
          GHPAT: ${{ inputs.pat }}
        run: |
          python3 -m pip install --quiet playwright
          python3 -m playwright install chromium
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb
          xvfb-run -a python3 dy.py
